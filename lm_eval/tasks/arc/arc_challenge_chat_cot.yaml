include: arc_challenge_chat.yaml
task: arc_challenge_chat_cot
# Reasoning-model variant: let the model think first, do not stop on the first
# period/newline, then extract the final answer letter. Inherits dataset,
# splits and target from arc_challenge_chat.yaml and overrides only the prompt,
# generation settings and filters below.
doc_to_text: 'Given the following question and four candidate answers (A, B, C and D), choose the best answer.\nQuestion: {{question.strip()}}\nA. {{choices.text[0]}}\nB. {{choices.text[1]}}\nC. {{choices.text[2]}}{% if choices.text|length > 3 %}\nD. {{choices.text[3]}}{% endif %}\nThink step by step, then end your response with "The best answer is [the_answer_letter]" where the [the_answer_letter] is one of A, B, C or D.'
# Drop the forced answer prefix so the model can emit its reasoning first.
gen_prefix: ""
generation_kwargs:
  max_gen_toks: 2048
  do_sample: false
  until: []
filter_list:
  - name: strict-match
    filter:
      - function: regex
        regex_pattern: "(?i)the best answer is\\s*\\(?([ABCD])\\)?"
        group_select: -1
        fallback: "[invalid]"
      - function: take_first
  - name: flexible-extract
    filter:
      - function: regex
        regex_pattern: "(?i)(?:the best answer is|answer\\s*:?\\s*is|answer\\s*:)\\s*\\(?([ABCD])\\)?"
        group_select: -1
        fallback: "[invalid]"
      - function: take_first
metadata:
  version: 1.0
